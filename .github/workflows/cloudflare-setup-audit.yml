name: cloudflare-dns-cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Remove the obsolete Pages CNAME
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zones_response="$(curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            'https://api.cloudflare.com/client/v4/zones?name=boss-cli.com')"
          zone_id="$(printf '%s' "$zones_response" | jq -er '.result | select(length == 1) | .[0].id')"

          records_response="$(curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=boss-cli.com")"
          record_id="$(printf '%s' "$records_response" | jq -er '
            [.result[] | select(
              .name == "boss-cli.com" and
              .type == "CNAME" and
              .content == "boss-cli-git.pages.dev"
            )] | select(length == 1) | .[0].id
          ')"

          delete_response="$(curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "$auth_header" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}")"
          printf '%s' "$delete_response" | jq -e '.success == true' >/dev/null

          verify_response="$(curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=boss-cli.com")"
          remaining_pages_cnames="$(printf '%s' "$verify_response" | jq '[
            .result[] | select(
              .name == "boss-cli.com" and
              .type == "CNAME" and
              .content == "boss-cli-git.pages.dev"
            )
          ] | length')"
          test "$remaining_pages_cnames" -eq 0
          echo 'Removed only the obsolete boss-cli-git.pages.dev CNAME; MX and TXT records were preserved.'
