name: cloudflare-dns-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Audit DNS access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zones_response="$(curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            'https://api.cloudflare.com/client/v4/zones?name=boss-cli.com')"
          zone_id="$(printf '%s' "$zones_response" | jq -er '.result | select(length == 1) | .[0].id')"

          records_response="$(curl --fail-with-body --silent --show-error \
            --header "$auth_header" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=boss-cli.com")"
          printf '%s' "$records_response" | jq '{
            dns_access: .success,
            records: [.result[] | {name, type, content, proxied}]
          }'
